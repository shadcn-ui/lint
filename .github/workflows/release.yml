name: Release

# Changesets flow: pushes to main with pending changesets open (or update) a
# "Version Packages" PR; merging that PR publishes `@shadcn/lint` to npm
# with provenance, authenticated via OIDC trusted publishing (id-token:
# write) — no npm token exists anywhere. The `@shadcn/lint` package on
# npmjs.com must list this repo + workflow as a trusted publisher. While
# the package is marked `private`, changesets skip it and nothing is
# published.
#
# The work is split so the token that can publish never shares a job with
# the project's dependencies:
# - `check` (read-only) installs everything and picks the mode. When
#   publishing, it runs the full gate set and packs the tarball into an
#   artifact.
# - `version` opens the version PR. It can push a branch but not publish.
# - `publish` holds id-token: write. It installs only the root workspace
#   tooling (changesets), with --ignore-scripts, and publishes the tarball
#   `check` packed. Nothing is built or tested there.
#
# Every action is pinned to a commit SHA.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # no `cache: pnpm` in this workflow on purpose: the Actions cache
          # is writable from lower-privileged workflow runs, and what this
          # job packs is published with provenance — install from the
          # registry, verified by the lockfile
          node-version: 24
      # test/bun.test.ts needs Bun
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      # "version" (changesets pending), "publish" (an unpublished version)
      # or "none"
      - id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - if: steps.mode.outputs.mode == 'publish'
        run: pnpm run typecheck
      - if: steps.mode.outputs.mode == 'publish'
        run: pnpm run test
      - if: steps.mode.outputs.mode == 'publish'
        run: pnpm run corpus:check
      # `pnpm pack` of each planned package (the tests left dist built;
      # prepack adds README + LICENSE), uploaded with the publish plan
      - id: pack
        if: steps.mode.outputs.mode == 'publish'
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}

  version:
    needs: check
    if: needs.check.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write # version PR branch
      pull-requests: write # version PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # root tooling only: changesets, its changelog plugin, prettier
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter lint-workspace
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

  publish:
    needs: check
    if: needs.check.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, GitHub releases
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@11.21.0
      # root tooling only, no lifecycle scripts: the changesets CLI is the
      # only installed code this job runs
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter lint-workspace
      # `changeset publish --from-pack-dir` on the tarball `check` packed;
      # the action then pushes git tags and creates GitHub releases from
      # the CLI's CHANGESETS_OUTPUT report
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.check.outputs.pack-dir-artifact-id }}
        env:
          # pnpm publish does not auto-enable provenance under trusted
          # publishing the way npm does; ask for it explicitly
          NPM_CONFIG_PROVENANCE: "true"
